[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "internscout"
version = "0.1.0"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["internscout", "internscout.sources", "internscout.site", "internscout.site.render", "growth"]
include-package-data = false

[tool.setuptools.package-dir]
internscout = "backend/internscout"
growth = "growth"

[tool.setuptools.package-data]
internscout = ["top_degree_fields.json", "us_top50_metros.json"]

[tool.setuptools.dynamic]
dependencies = {file = ["backend/requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["backend/tests", "growth/tests"]
# Preserve both legacy test helper imports: tests.test_seo_pages and test_seo_pages.
pythonpath = ["backend", "backend/tests"]

[tool.coverage.run]
omit = ["*/growth/tests/*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Start with syntax and control-flow mistakes the current tree already passes.
# Expand deliberately in later PRs; formatting is a separate mechanical change.
select = ["E9", "F63", "F7"]

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
line-ending = "lf"
docstring-code-format = false
