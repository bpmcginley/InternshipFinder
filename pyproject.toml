[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Start with syntax and control-flow mistakes the current tree already passes.
# Expand deliberately in later PRs; formatting is a separate mechanical change.
select = ["E9", "F63", "F7"]

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
line-ending = "lf"
docstring-code-format = false
