<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>InternScout</title>
<!-- was: <meta name="description" content="Free internship, co-op and research search for UMass students, ranked for your major, class year and the states you pick."/> -->
<!-- Paid plans went live 2026-09-19 (worker/wrangler.toml: PAYMENTS_ENABLED=1, Supporter $5/month,
     Pro $12/month), so "free" standing alone now overstates it. What is still true, and is the reason
     most students stay, is that search, ranking and this dashboard cost nothing and ask for no account;
     only the AI allowance is what money buys. Both halves have to be in the one sentence a search
     result or a link preview shows. -->
<!-- was: <meta name="description" content="Free internship, co-op and research search for UMass students, ranked for your major, class year and the states you pick. No sign-in needed; paid plans only add AI."/> -->
<!-- That wording was 164 characters and the qualifier was its tail. Google cuts a description at
     roughly 155-160, so the snippet on the result page ended at "...the states you pick." - the bare
     "Free" claim the sentence was lengthened to qualify. This one is 152 characters, so the qualifier
     survives. og:description below keeps the full 164, because Discord, Slack and iMessage show far
     more of a blurb than a search result does. -->
<meta name="description" content="Free internship, co-op and research search for UMass students, ranked for your major, class year and the states you pick. No sign-in; paid plans add AI."/>

<!-- Link previews. Before today a link pasted into a group chat, Discord or a text message rendered as
     a bare grey URL: no title, no image, no blurb. Nearly every install starts with one student sending
     this link to another, so these nine tags sit between a share and an install.
     og:image is the absolute URL of docs/og-preview.png, a 1200x630 card that scripts/make_og_image.py
     builds. It pointed at icon128.png until 2026-09-19, and icon128.png is genuinely 128x128: Facebook's
     scraper rejects any og:image under 200x200 and X's card needs at least 144x144, so on both of those
     the link still came back as a title-only card with no thumbnail - the bare preview these tags exist
     to end. The URL is absolute because the OG spec asks for one; the old relative form did resolve
     against og:url, but only on scrapers that bother to resolve it. icon128.png keeps the rel=icon and
     rel=apple-touch-icon links below, which is the job a 128px square is the right size for.
     was: "og:image is document-relative on purpose: the site is served from the /InternshipFinder/
     project path on github.io, so a root-relative /icon128.png would 404, and scrapers resolve a
     relative image against the absolute og:url below." -->
<meta property="og:title" content="InternScout · internships ranked for your major"/>
<meta property="og:description" content="Free internship, co-op and research search for UMass students, ranked for your major, class year and the states you pick. No sign-in needed; paid plans only add AI."/>
<meta property="og:type" content="website"/>
<meta property="og:url" content="https://internscout.org/"/>
<!-- The landing pages under internships/ link here with ?field= and ?state= so the list opens on what the
     student was reading. Those are the same page to a search engine; this keeps them one result. -->
<link rel="canonical" href="https://internscout.org/"/>
<!-- Mastodon shows internscout.org as verified on @internscout@mastodon.social when this page links back. -->
<link rel="me" href="https://mastodon.social/@internscout"/>
<!-- was: <meta property="og:image" content="icon128.png"/> -->
<meta property="og:image" content="https://internscout.org/og-preview.png"/>
<!-- was: <meta name="twitter:card" content="summary"/> -->
<!-- summary renders a square thumbnail, and a centre crop of a 1200x630 card keeps only x=285-915,
     which cuts the icon plate scripts/make_og_image.py draws at x=80-296 and the "Search free. Apply
     faster." line it draws at x=84. summary_large_image shows the 1.91:1 card whole. -->
<meta name="twitter:card" content="summary_large_image"/>
<!-- was: "Both files already sit in docs/, copied from extension/icons, and are genuinely 48x48 and
     128x128: 48 is the size a browser tab renders, and 128 is the largest we have, so it serves the
     iOS home-screen bookmark and the link preview both." -->
<!-- Both files already sit in docs/, copied from extension/icons, and are genuinely 48x48 and 128x128:
     48 is the size a browser tab renders, and 128 is the largest icon we ship, so it serves the iOS
     home-screen bookmark. It no longer serves the link preview: 128x128 is under Facebook's 200x200
     floor, so og:image above points at og-preview.png instead. -->
<link rel="icon" type="image/png" sizes="48x48" href="icon48.png"/>
<link rel="icon" type="image/png" sizes="128x128" href="icon128.png"/>
<!-- was: <link rel="apple-touch-icon" href="icon128.png"/> -->
<!-- Installable as an app: the manifest lists the 192px and 512px icons Chrome requires before it
     offers "Install", and iOS gets a 180px square with no transparent corners (it rounds them itself,
     and paints transparency black). scripts/make_app_icons.py draws all of them. -->
<link rel="apple-touch-icon" href="icon180.png"/>
<link rel="manifest" href="manifest.webmanifest"/>
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#131416" media="(prefers-color-scheme: dark)"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet"/>
<style>
  :root{
    --paper:#f6f4ef; --panel:#fffefb; --sunk:#efece5;
    /* ink3 is the small grey text: column headers, dates, counts. It was #868b92, which is 3.2:1
       on this paper and fails WCAG AA for text under 18px; #646a73 is 5.0:1. */
    --ink:#17191c; --ink2:#454a52; --ink3:#646a73;
    --rule:#e2ded4; --rule2:#ece9e1;
    --accent:#1d5c46; --accent-ink:#fff; --accent-soft:#e3eee8;
    --blue:#2b5aa0; --amber:#9a6412; --amber-soft:#f6ecd9; --green:#1f7a4d; --red:#a8362c;
    --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
    --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#131416; --panel:#1a1b1e; --sunk:#232427;
    --ink:#ecebe6; --ink2:#b8b6af; --ink3:#95948e;
    --rule:#2c2d31; --rule2:#232427;
    --accent:#7cc3a1; --accent-ink:#0f1a15; --accent-soft:#1c2a24;
    --blue:#8fb2e8; --amber:#e0b25e; --amber-soft:#2e2717; --green:#7cc3a1; --red:#e48a80;
    color-scheme:dark;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
  a{color:inherit}
  button,input,select{font-family:var(--sans)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .wrap{max-width:1320px;margin:0 auto;padding:0 28px}

  header.top{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;padding:26px 0 14px;border-bottom:1px solid var(--ink)}
  .mark{font:600 30px/1 var(--serif);letter-spacing:-.6px;margin:0}
  .sub{color:var(--ink2);margin-top:8px;font-size:14px}
  .sub a{color:inherit;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
  .sub a:hover{text-decoration-color:var(--ink)}
  .sub button{all:unset;cursor:pointer;color:var(--accent);font-weight:500}
  .sub button:hover{text-decoration:underline;text-underline-offset:3px}
  .top-r{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .signed{display:inline-flex;align-items:center;gap:2px;color:var(--green);font-size:13px;padding-left:6px}

  .btn{font:500 13px/1 var(--sans);height:34px;padding:0 14px;border-radius:6px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
  .btn:hover:not(:disabled){border-color:var(--ink3)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.primary:hover:not(:disabled){filter:brightness(1.1)}
  .btn.quiet{border-color:transparent;background:transparent;color:var(--ink2);padding:0 8px}
  .btn.quiet:hover:not(:disabled){color:var(--ink);border-color:transparent}
  .btn.small{height:28px;padding:0 10px;font-size:12.5px}
  .btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
  .btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
  .btn.danger:hover:not(:disabled){border-color:var(--red)}
  .count{font:500 11px/1 var(--mono);background:var(--amber-soft);color:var(--amber);padding:4px 6px;border-radius:4px}
  .count.ok{background:var(--accent-soft);color:var(--green)}
  .busy{color:var(--ink3);font:12px var(--mono);margin-right:4px}

  /* landing: one hero column and one "how it works" column. The old third column repeated the
     three setup steps that the setup card itself shows. */
  .landing{display:grid;grid-template-columns:minmax(280px,1.3fr) minmax(280px,1fr);gap:20px 56px;padding:28px 0 26px;border-bottom:1px solid var(--rule)}
  .landing h2{font:600 28px/1.2 var(--serif);letter-spacing:-.4px;margin:0 0 12px;max-width:22ch}
  .landing h3{font:600 14px var(--sans);margin:0 0 8px}
  .landing p{color:var(--ink2);margin:0 0 10px;font-size:15px;max-width:58ch}
  .landing .fine{color:var(--ink3);font-size:13px}
  .landing ul{margin:0;padding-left:18px;color:var(--ink2)}
  .landing li{margin:5px 0}
  .landing-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

  /* profile setup */
  .setup{margin:18px 0 0;padding:20px 24px 18px}
  .setup-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .setup-head h2{font:600 22px/1.2 var(--serif);margin:0}
  .setup h3{font:600 15px var(--sans);margin:10px 0 12px}
  .steps{display:flex;gap:6px}
  .dot{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font:500 11.5px var(--mono);border:1px solid var(--rule);color:var(--ink3)}
  .dot.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .dot.done{border-color:var(--accent);color:var(--accent)}
  .lbl{display:block;font-weight:500;font-size:13px;margin:0 0 14px}
  .lbl > .field,.lbl > .row2{margin-top:6px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row2.tight{gap:6px;margin-top:6px}
  .row2 .lbl{margin-bottom:6px}
  .ms.wide{width:100%}
  .setup .field.sel select{width:100%}
  fieldset{border:0;margin:0 0 14px;padding:0}
  legend{font-weight:500;font-size:13px;padding:0;margin-bottom:6px}
  .checks{display:flex;flex-wrap:wrap;gap:6px 18px}
  .check{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--ink2);cursor:pointer}
  .check input{margin:0}
  .check .c,.stategrid .c{color:var(--ink3);font:11px var(--mono);margin-left:4px}
  .check.remote{margin:4px 0 10px}
  .shortcuts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .stategrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:2px 12px;margin-bottom:10px;max-height:340px;overflow:auto;padding:6px 8px;border:1px solid var(--rule2);border-radius:6px}
  .stategrid .check{padding:3px 2px}
  .stategrid .check.on{color:var(--ink)}
  .setup-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--rule2)}
  .setup-danger{display:flex;gap:8px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px}
  .setup-danger .meta{margin:0}

  /* figures: the numbers in one row, and one plain sentence under them saying which states they
     cover and when the scan ran. That sentence used to float right of the numbers and wrapped
     under them on anything narrower than about 1100px, leaving a hole. */
  .figures{padding:20px 0 18px;border-bottom:1px solid var(--rule)}
  .figrow{display:flex;gap:40px;flex-wrap:wrap}
  .fig .n{font:600 34px/1 var(--serif);font-variant-numeric:tabular-nums;letter-spacing:-.6px}
  .fig .l{color:var(--ink3);font-size:13px;margin-top:6px}
  .coverage{color:var(--ink2);font-size:13.5px;margin-top:14px;line-height:1.6}
  .updated{color:var(--ink3)}

  .notice{margin:16px 0 0;padding:12px 16px;background:var(--panel);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:4px;color:var(--ink2)}
  .notice b{color:var(--ink)}
  .notice a{color:var(--accent);font-weight:500}
  .notice.quietnote{border-left-color:var(--rule);font-size:13px}

  /* filters: search, field, state and sort on the first row, everything else behind "More filters".
     Thirteen equal-looking dropdowns in one wrapping row was the single hardest thing to read on
     the page. */
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:18px 0 0}
  .filters.extra{padding:10px 14px 12px;margin-top:10px;background:var(--sunk);border-radius:8px;gap:8px}
  .filters.extra .field{background:var(--panel)}
  .filterbar-foot{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;padding:10px 0 14px;font-size:13px;color:var(--ink2)}
  .filterbar-foot .btn.quiet{padding:0 6px;height:28px;font-size:13px}
  .field{position:relative;display:flex;align-items:center;min-height:36px;background:var(--panel);border:1px solid var(--rule);border-radius:6px}
  .field:focus-within{border-color:var(--ink3)}
  .field input[type=text],.field select{border:0;background:transparent;color:var(--ink);font-size:14px;height:34px;padding:0 10px;outline:none}
  .field select{appearance:none;-webkit-appearance:none;padding-right:28px;cursor:pointer}
  .field select option{background:var(--panel);color:var(--ink)}
  .field.sel::after{content:"";position:absolute;right:12px;top:13px;width:5px;height:5px;border-right:1.5px solid var(--ink3);border-bottom:1.5px solid var(--ink3);transform:rotate(45deg);pointer-events:none}
  .field.search{flex:1 1 260px;min-width:220px}
  .field.search input{width:100%}
  .field.search::before{content:"";width:14px;height:14px;margin-left:10px;flex:none;border:1.6px solid var(--ink3);border-radius:50%;box-shadow:5px 5px 0 -3.5px var(--ink3);transform:scale(.85)}
  .field.search input{padding-left:6px}
  /* on/off filters look like switches, not like another dropdown */
  .field.toggle{gap:8px;padding:0 12px 0 10px;cursor:pointer;color:var(--ink2);font-size:13.5px;border-radius:18px}
  .field.toggle:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
  .morebtn{height:36px;border-radius:6px;gap:6px}
  .morebtn .count{margin-left:2px}
  .spacer{flex:1}

  .ms{min-width:160px}
  .ms .box{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:4px 6px;width:100%;cursor:text}
  .ms input{flex:1;min-width:60px;height:24px;border:0;outline:none;background:transparent;color:var(--ink);font-size:13px;padding:0 4px}
  .chip{display:inline-flex;gap:2px;align-items:center;background:var(--sunk);border-radius:4px;padding:2px 2px 2px 7px;font-size:12px;color:var(--ink)}
  .chip button{border:0;background:none;color:var(--ink3);cursor:pointer;font:15px/1 var(--sans);padding:0 4px}
  .chip button:hover{color:var(--red)}
  .drop{position:absolute;top:calc(100% + 4px);left:0;z-index:50;min-width:100%;max-height:280px;overflow:auto;background:var(--panel);border:1px solid var(--rule);border-radius:6px;box-shadow:0 12px 32px rgba(20,20,20,.12);padding:4px}
  .opt{display:flex;justify-content:space-between;gap:18px;padding:6px 8px;border-radius:4px;font-size:13px;cursor:pointer;white-space:nowrap}
  .opt.act{background:var(--sunk)}
  .opt .c{color:var(--ink3);font:11.5px var(--mono)}

  .sheet{background:var(--panel);border:1px solid var(--rule);border-radius:8px}
  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  thead th{background:var(--panel);text-align:left;font:500 12.5px var(--sans);color:var(--ink3);padding:11px 14px;border-bottom:1px solid var(--rule);white-space:nowrap}
  thead th.sort{cursor:pointer;user-select:none}
  thead th.sort:hover,thead th.on{color:var(--ink)}
  thead th.sort button{all:inherit;cursor:pointer;display:inline}
  thead th.sort button:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:2px}
  thead th.on::after{content:" \2193"}
  tbody td{padding:12px 12px;border-bottom:1px solid var(--rule2);vertical-align:top}
  tbody td:first-child,thead th:first-child{padding-left:16px}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover td{background:color-mix(in srgb,var(--sunk) 50%,transparent)}
  tbody tr.sel td{background:var(--accent-soft)}
  tbody tr.dim td{opacity:.62}
  input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:15px;height:15px;margin:2px 0 0;cursor:pointer}
  .c-chk{width:34px}
  .c-co{min-width:240px;width:32%}
  .c-field{min-width:120px}
  .c-loc{min-width:140px}
  /* A pay string can run to "$60,000 - $80,000 / year"; let it wrap rather than widen the table. */
  .c-pay{max-width:150px}
  .c-links{white-space:nowrap}
  .co{font-weight:600}
  .role{color:var(--ink2);margin-top:1px}
  .meta{color:var(--ink3);font-size:12.5px;margin-top:3px}
  .new{color:var(--accent);font:600 11.5px var(--sans);margin-left:8px}
  .closed{color:var(--red)}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px}
  .muted{color:var(--ink3)}
  .score{display:inline-flex;align-items:center;gap:8px}
  .score .bar{width:34px;height:4px;background:var(--rule2);border-radius:2px;overflow:hidden}
  .score .bar i{display:block;height:100%;background:var(--ink3)}
  .score.hi .bar i{background:var(--green)} .score.mid .bar i{background:var(--amber)}
  select.mine{font-size:12.5px;color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:5px;height:28px;padding:0 4px;cursor:pointer}
  .st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;margin-top:7px;color:var(--ink2);white-space:nowrap;cursor:default}
  .st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink3)}
  .st.working::before{background:var(--blue)}
  .st.needs_you{color:var(--amber)} .st.needs_you::before{background:var(--amber)}
  .st.ready_to_submit,.st.submitted{color:var(--green)} .st.ready_to_submit::before,.st.submitted::before{background:var(--green)}
  .st.failed{color:var(--red)} .st.failed::before{background:var(--red)}
  .open-link{font-weight:500;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px;white-space:nowrap}
  .open-link:hover{text-decoration-color:var(--ink)}
  .rowbtn{margin-top:7px;font:500 12.5px var(--sans);color:var(--accent);background:none;border:0;padding:0;cursor:pointer;white-space:nowrap}
  .rowbtn:hover{text-decoration:underline;text-underline-offset:3px}
  .report{display:inline-block;margin-top:7px;font-size:12px;color:var(--ink3);text-decoration:none}
  .report:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
  .whybtn{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0;color:inherit;cursor:pointer;font:inherit}
  .whybtn .why-l{font-size:11.5px;color:var(--ink3)}
  .whybtn:hover .why-l{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
  tbody tr.opened td{border-bottom-color:transparent}
  tbody tr.why td,tbody tr.why:hover td{background:var(--sunk);padding:16px 18px 18px;opacity:1}
  .whyg{display:grid;grid-template-columns:minmax(220px,1fr) minmax(280px,1.5fr) minmax(220px,1fr);gap:30px}
  .whyg h4{margin:0 0 9px;font:600 12.5px var(--sans);color:var(--ink)}
  .whyg a{color:var(--accent)}
  .part{display:grid;grid-template-columns:118px 1fr 42px;gap:8px;align-items:center;font-size:12.5px;color:var(--ink2);margin:4px 0}
  .part .bar{height:4px;background:var(--rule);border-radius:2px;overflow:hidden}
  .part .bar i{display:block;height:100%;background:var(--accent)}
  .part .num{text-align:right;font-size:11.5px}
  .tag{display:inline-block;font-size:12px;padding:2px 7px;border-radius:4px;margin:0 4px 5px 0;background:var(--panel);border:1px solid var(--rule);color:var(--ink2)}
  .tag.ok{border-color:color-mix(in srgb,var(--green) 45%,transparent);color:var(--green)}
  .tag.miss{border-color:color-mix(in srgb,var(--red) 40%,transparent);color:var(--red)}
  .flag{font-size:12.5px;margin:3px 0;color:var(--ink2)}
  .flag.bad{color:var(--red)} .flag.warn{color:var(--amber)} .flag.good{color:var(--green)}
  .more{display:flex;justify-content:center;padding:14px;border-top:1px solid var(--rule2)}
  footer{color:var(--ink3);font-size:13px;padding:14px 0 48px;max-width:78ch}
  footer .links{display:flex;gap:4px 16px;flex-wrap:wrap;align-items:center;margin-top:8px}
  footer .links a{color:var(--ink2);text-decoration:none}
  footer .links a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
  .empty{padding:72px 20px;text-align:center;color:var(--ink2)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  noscript p{max-width:640px;margin:40px auto;padding:0 20px;color:var(--ink2)}
  @media (max-width:900px){
    .whyg{grid-template-columns:1fr;gap:18px}
    .landing{grid-template-columns:1fr}
  }
  @media (max-width:760px){
