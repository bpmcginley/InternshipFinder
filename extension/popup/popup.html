<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../lib/theme.css">
<style>
body{width:300px}
.head{display:flex;align-items:baseline;justify-content:space-between;padding:16px 16px 11px;border-bottom:1px solid var(--ink)}
.mark{font:600 20px/1 var(--serif);letter-spacing:-.3px}
.ver{color:var(--ink3);font:11px var(--mono)}
.figs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--rule)}
.fig{padding:14px 14px 12px}
.fig+.fig{border-left:1px solid var(--rule)}
.fig .n{font:600 26px/1 var(--serif);font-variant-numeric:tabular-nums}
.fig .l{color:var(--ink3);font-size:11.5px;margin-top:6px}
.fig.warn .n{color:var(--amber)} .fig.good .n{color:var(--green)} .fig.zero .n{color:var(--ink3)}
.note{padding:14px 16px 0;color:var(--ink2);font-size:12.5px}
.actions{padding:14px 16px 16px;display:grid;gap:8px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style></head><body>
<div class="head"><span class="mark">InternScout</span><span class="ver" id="ver"></span></div>
<div class="figs" id="figs" hidden>
  <div class="fig warn"><div class="n" id="n-need">0</div><div class="l">Need you</div></div>
  <div class="fig good"><div class="n" id="n-ready">0</div><div class="l">Ready</div></div>
  <div class="fig"><div class="n" id="n-work">0</div><div class="l">In progress</div></div>
</div>
<div class="note" id="note" hidden></div>
<div class="actions">
  <button class="btn primary" id="queue">Open queue</button>
  <div class="pair"><button class="btn" id="dash">Dashboard</button><button class="btn" id="dive">Deep Dive</button></div>
</div>
<script type="module" src="popup.js"></script>
</body></html>
