<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; form-action 'none'">
  <title>Lever-like synthetic offline application</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 16px/1.5 system-ui; }
    .application-question { margin: 1rem 0; }
    label, input, select { display: block; }
    input:not([type=file]), select { box-sizing: border-box; width: 100%; padding: .5rem; }
    button { padding: .6rem 1rem; margin: .3rem; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <p><strong>Synthetic offline fixture.</strong> Fictional employer and applicant only. No data leaves this page.</p>
  <h1>Example Robotics — Product Intern</h1>
  <form id="application-form">
    <section id="details">
      <h2>Application details</h2>
      <div class="application-question"><label for="name">Full name ✱</label><input id="name" name="name" autocomplete="name" required></div>
      <div class="application-question"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
      <div class="application-question"><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></div>
      <div class="application-question"><label for="linkedin">LinkedIn URL</label><input id="linkedin" name="urls[LinkedIn]"></div>
      <div class="application-question"><label for="resume">Resume/CV ✱</label><input id="resume" name="resume" type="file" accept=".pdf,.doc,.docx" required></div>
      <div class="application-question"><label for="cover">Cover Letter</label><input id="cover" name="coverLetter" type="file" accept=".pdf,.doc,.docx"></div>
      <div class="application-question">
        <label for="sponsorship">Will you now or in the future require sponsorship?</label>
        <select id="sponsorship" name="sponsorship"><option value="">Select...</option><option>Yes</option><option>No</option></select>
      </div>
      <button type="button" id="continue">Continue</button>
    </section>
    <section id="review" hidden>
      <h2>Review application</h2>
      <p>Check every answer and the attachment. The student makes the final decision.</p>
      <button type="button" id="edit">Edit application</button>
      <button type="submit" id="submit-application">Submit application</button>
    </section>
  </form>
  <p id="status" role="status">Nothing submitted.</p>
  <script>
    const details = document.getElementById('details'), review = document.getElementById('review');
    document.getElementById('continue').onclick = () => { details.hidden = true; review.hidden = false; };
    document.getElementById('edit').onclick = () => { review.hidden = true; details.hidden = false; };
    // Intentionally no endpoint. Even a real student's final click never submits an application.
    document.getElementById('application-form').addEventListener('submit', (event) => {
      event.preventDefault(); document.getElementById('status').textContent = 'Local fixture final click received. Nothing sent.';
    });
  </script>
</body>
</html>
