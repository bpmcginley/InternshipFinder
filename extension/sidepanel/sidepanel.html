<!DOCTYPE html><html><head><meta charset="utf-8"><title>InternScout queue</title>
<link rel="stylesheet" href="../lib/theme.css">
<style>
header{display:flex;align-items:flex-end;gap:8px;padding:14px 14px 0;border-bottom:1px solid var(--ink);position:sticky;top:0;background:var(--paper);z-index:2}
header b{font:600 18px/1 var(--serif);letter-spacing:-.3px;padding-bottom:10px}
nav{display:flex;gap:14px;margin-left:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--ink3);padding:0 0 9px;cursor:pointer;font:500 12.5px var(--sans)}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);border-bottom-color:var(--ink)}
main{padding:12px 14px 28px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:11px 12px;margin-bottom:8px}
.card.needs_you{box-shadow:inset 3px 0 var(--amber)}
.card.ready_to_submit{box-shadow:inset 3px 0 var(--green)}
.card.failed{box-shadow:inset 3px 0 var(--red)}
.top{display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ink3)}
.working .dot{background:var(--blue)}.needs_you .dot{background:var(--amber)}.ready_to_submit .dot,.submitted .dot{background:var(--green)}.failed .dot{background:var(--red)}
.co{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{margin-left:auto;font-size:11.5px;color:var(--ink3);white-space:nowrap}
.needs_you .st{color:var(--amber)} .ready_to_submit .st{color:var(--green)} .failed .st{color:var(--red)}
.title{color:var(--ink2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg{margin-top:7px;white-space:pre-wrap}
ul{margin:6px 0 0 18px;padding:0;color:var(--ink2)}
li{margin:2px 0}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
button.b{background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:5px 10px;font:500 12px var(--sans);cursor:pointer}
button.b:hover{border-color:var(--ink3)}
button.b.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.b.link{background:none;border:0;color:var(--ink3);padding:5px 2px}
button.b.link:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
textarea,input{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:7px 8px;font:inherit}
textarea:focus,input:focus{outline:none;border-color:var(--ink3)}
textarea{min-height:60px;margin-top:8px;resize:vertical}
details{margin-top:8px;color:var(--ink3);font-size:12px}
summary{cursor:pointer}
details div{padding:3px 0;border-top:1px solid var(--rule2)}
.empty{color:var(--ink2);text-align:center;padding:36px 12px;line-height:1.7}
.group{font:600 12px var(--sans);color:var(--ink2);margin:18px 0 8px}
main>.group:first-child{margin-top:4px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px;align-items:center}
code{font:12px var(--mono)}
.q{font-weight:600;margin-top:7px}
.small{font-size:12px;color:var(--ink3)}
a{color:var(--accent)}
</style></head><body>
<header><b>InternScout</b><nav><button data-tab="queue" class="on">Queue</button><button data-tab="answers">Answers</button><button data-tab="accounts">Accounts</button></nav></header>
<main id="main"></main>
<script type="module" src="sidepanel.js"></script>
</body></html>
