<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>InternScout queue</title>
<link rel="stylesheet" href="../lib/theme.css">
<style>
header{display:flex;align-items:flex-end;gap:8px;padding:14px 14px 0;border-bottom:1px solid var(--ink);position:sticky;top:0;background:var(--paper);z-index:2}
header b{font:600 var(--fs-5)/1 var(--serif);letter-spacing:-.3px;padding-bottom:10px}
nav{display:flex;gap:14px;margin-left:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--ink3);padding:0 0 9px;cursor:pointer;font:500 var(--fs-2) var(--sans)}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);border-bottom-color:var(--ink)}
main{padding:12px 14px 28px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-lg);padding:11px 12px;margin-bottom:8px}
/* A card waiting on the student is the one thing in this panel that must be seen first, so it is
   tinted as well as edged. Done and in-progress cards stay plain. */
.card.needs_you{box-shadow:inset 3px 0 var(--amber);background:color-mix(in srgb,var(--amber-soft) 45%,var(--panel))}
.card.ready_to_submit{box-shadow:inset 3px 0 var(--green)}
.card.failed{box-shadow:inset 3px 0 var(--red)}
/* Job card (A2 component 8, sidepanel/card.js): company and title on the first line, then the status chip,
   then one row of actions. was: a coloured dot, the company and the chip on one line, the title under it. */
.head{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink2)}
.co{font-weight:600;color:var(--ink)}
.meta{display:flex;align-items:center;gap:8px;margin-top:6px}
/* Status chips (A2 component 5): 12px, a soft fill and an icon, so the state never rests on colour alone.
   was: 11.5px with colour only, and amber and green under AA (theme.css). */
.st{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-1);font-weight:500;color:var(--ink2);white-space:nowrap;background:var(--sunk);padding:2px 8px 2px 6px;border-radius:var(--r-sm)}
.needs_you .st{color:var(--amber);background:var(--amber-soft)} .ready_to_submit .st,.submitted .st{color:var(--green);background:var(--accent-soft)} .failed .st{color:var(--red)}
.needs_you .st::before,.ready_to_submit .st::before,.submitted .st::before,.failed .st::before{content:"";width:12px;height:12px;flex:none;background:currentColor;-webkit-mask:var(--i) center/contain no-repeat;mask:var(--i) center/contain no-repeat}
.needs_you .st::before{--i:var(--i-alert)} .ready_to_submit .st::before,.submitted .st::before{--i:var(--i-check)} .failed .st::before{--i:var(--i-cross)}
.cost{color:var(--ink3);font-size:var(--fs-1);white-space:nowrap}
.msg{margin-top:7px;white-space:pre-wrap}
ul{margin:6px 0 0 18px;padding:0;color:var(--ink2)}
li{margin:2px 0}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
/* Buttons are theme.css .btn.small (32px) with primary and quiet. was: the side panel's own button.b
   (about 26px, then sized like .btn.small in PR #106). */
.row .btn.quiet{padding:0 4px}
/* was: border var(--rule) and outline:none on focus (see onboarding.html); the theme's ring shows now. */
textarea,input{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--field-border);border-radius:var(--r);padding:7px 8px;font:inherit}
textarea{min-height:60px;margin-top:8px;resize:vertical}
details{margin-top:8px;color:var(--ink3);font-size:var(--fs-1)}
summary{cursor:pointer}
details div{padding:3px 0;border-top:1px solid var(--rule2)}
.empty{color:var(--ink2);text-align:center;padding:36px 12px;line-height:1.7}
.group{font:600 var(--fs-2) var(--sans);color:var(--ink);margin:18px 0 8px}
.group .n{color:var(--ink3);font-weight:500;margin-left:4px}
main>.group:first-child{margin-top:4px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px;align-items:center}
code{font:var(--fs-1) ui-monospace,Consolas,monospace}
.q{font-weight:600;margin-top:7px}
.small:not(.btn){font-size:var(--fs-1);color:var(--ink3)}
a{color:var(--accent)}
/* The review card (lib/review.js): quiet on purpose. No colour edge like the job cards, which carry
   things the student must act on; this one can be ignored and nothing happens. */
.card.review{background:var(--panel);border-style:dashed}
.card.review .q{margin:0;font-weight:600}
.card.review .msg{margin-top:4px;color:var(--ink2);font-size:var(--fs-2)}
.card.review .fb{margin-top:8px}
.foot{display:flex;justify-content:center;margin-top:6px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style></head><body>
<header><b>InternScout</b><nav><button data-tab="queue" class="on">Queue</button><button data-tab="answers">Answers</button><button data-tab="accounts">Accounts</button></nav></header>
<main id="main"></main>
<div id="live" class="sr" role="status" aria-live="polite"></div>
<script type="module" src="sidepanel.js"></script>
</body></html>
