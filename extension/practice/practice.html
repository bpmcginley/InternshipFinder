<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <title>Practice Auto-Apply · InternScout</title>
    <link rel="stylesheet" href="../lib/theme.css" />
    <link rel="stylesheet" href="practice.css" />
    <script defer src="../agent/guard.js"></script>
    <script defer src="../agent/actions.js"></script>
    <script defer src="../agent/dom.js"></script>
    <script type="module" src="practice.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Practice Auto-Apply</h1>
        <p>
          Try filling a sample internship application. This page uses sample details and sends
          nothing.
        </p>
      </header>
      <form aria-labelledby="sample-title" autocomplete="off">
        <h2 id="sample-title">Sample application</h2>
        <button class="btn primary" id="fill" type="button">Fill sample details</button>
        <div class="fields">
          <label for="first_name"
            >First name <input id="first_name" name="first_name" type="text" readonly
          /></label>
          <label for="last_name"
            >Last name <input id="last_name" name="last_name" type="text" readonly
          /></label>
          <label for="email">Email <input id="email" name="email" type="email" readonly /></label>
          <label for="phone">Phone <input id="phone" name="phone" type="tel" readonly /></label>
        </div>
        <p id="result" role="status" aria-atomic="true"></p>
        <button class="btn" id="complete" type="button" disabled>Complete practice</button>
      </form>
    </main>
  </body>
</html>
