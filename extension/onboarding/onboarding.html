<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>InternScout Deep Dive</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../lib/theme.css">
<style>
body{font-size:14px;line-height:1.55}
header{border-bottom:1px solid var(--ink);padding:20px 28px 0;display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap;position:sticky;top:0;background:var(--paper);z-index:5}
header h1{font:600 22px/1 var(--serif);margin:0 0 12px;letter-spacing:-.3px}
.steps{display:flex;gap:18px;flex-wrap:wrap}
.steps button{background:none;border:0;border-bottom:2px solid transparent;color:var(--ink3);padding:0 0 10px;cursor:pointer;font:500 13px var(--sans)}
.steps button:hover{color:var(--ink)}
.steps button.on{color:var(--ink);border-bottom-color:var(--ink)}
.steps button.done::before{content:"\2713\00a0";color:var(--green)}
main{max-width:820px;margin:0 auto;padding:36px 28px 72px}
h2{margin:0 0 6px;font:600 30px/1.15 var(--serif);letter-spacing:-.5px}
.lead{color:var(--ink2);margin:0 0 26px;max-width:62ch}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:18px 20px;margin-bottom:16px}
.card h3{margin:0 0 12px;font:600 15px var(--sans)}
label.f{display:block;margin-bottom:12px}
label.f span{display:block;color:var(--ink2);font-size:13px;margin-bottom:4px}
input[type=text],input[type=password],input[type=email],input[type=url],input[type=date],input[type=number],select,textarea{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;font:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink3)}
textarea{min-height:84px;resize:vertical}
textarea.code{font:12px/1.5 var(--mono);min-height:160px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0 16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nav{display:flex;justify-content:space-between;margin-top:26px}
.muted{color:var(--ink3)} .small{font-size:12.5px}
.ok{color:var(--green)} .err{color:var(--red)} .warn{color:var(--amber)}
.slot{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule2)}
.slot:last-child{border-bottom:0}
.slot .name{flex:1;min-width:0}
.slot .name b{display:block;font-weight:600}
.chat{display:flex;flex-direction:column;gap:10px;max-height:58vh;overflow:auto;padding:4px 2px 10px}
.msg{padding:10px 13px;border-radius:12px;max-width:85%;white-space:pre-wrap}
.msg.a{background:var(--panel);border:1px solid var(--rule);align-self:flex-start;border-bottom-left-radius:4px}
.msg.u{background:var(--ink);color:var(--paper);align-self:flex-end;border-bottom-right-radius:4px}
.banner{background:var(--accent-soft);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:6px;padding:11px 14px;margin-bottom:18px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--ink3);border-top-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.story{border-left:2px solid var(--accent);padding-left:12px;margin:10px 0}
a{color:var(--accent)}
</style></head><body>
<header><h1>Deep Dive</h1><div class="steps" id="steps"></div></header>
<main id="main"></main>
<script src="../vendor/mammoth.browser.min.js"></script>
<script type="module" src="onboarding.js"></script>
</body></html>
