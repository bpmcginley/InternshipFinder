name: Select public listing data
description: Check out the data branch snapshot or use the primary checkout when it is absent
inputs:
  expected-commit:
    description: Verified catch-up data commit, or empty for ordinary selection
  expected-tree:
    description: Verified catch-up public data tree, or empty for ordinary selection
  upstream-run:
    description: Verified catch-up writer run, or empty for ordinary selection
outputs:
  directory:
    description: Absolute path to the selected public listing export
    value: ${{ steps.select.outputs.directory }}
runs:
  using: composite
  steps:
    - name: Resolve the data branch
      id: resolve
      shell: bash
      env:
        CATCHUP_COMMIT: ${{ inputs.expected-commit }}
        CATCHUP_TREE: ${{ inputs.expected-tree }}
        CATCHUP_UPSTREAM_RUN: ${{ inputs.upstream-run }}
      run: python "$GITHUB_ACTION_PATH/listing_data.py" resolve

    - name: Check out the public listing snapshot
      if: steps.resolve.outputs.sha != ''
      uses: actions/checkout@v7
      with:
        ref: ${{ steps.resolve.outputs.sha }}
        path: .listing-data
        sparse-checkout: /docs/data/
        sparse-checkout-cone-mode: false
        persist-credentials: false

    - name: Select the public listing export
      id: select
      shell: bash
      env:
        DATA_SHA: ${{ steps.resolve.outputs.sha }}
        CATCHUP_COMMIT: ${{ inputs.expected-commit }}
        CATCHUP_TREE: ${{ inputs.expected-tree }}
        CATCHUP_UPSTREAM_RUN: ${{ inputs.upstream-run }}
      run: python "$GITHUB_ACTION_PATH/listing_data.py" select
