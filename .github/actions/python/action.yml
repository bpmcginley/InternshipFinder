name: Python setup
description: Python 3.12 with optional existing backend requirements
inputs:
  cache:
    description: Optional setup-python dependency cache
    default: ''
  install-backend:
    description: Install backend/requirements.txt after setup
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: ${{ inputs.cache }}
    - name: Install backend dependencies
      if: inputs.install-backend == 'true'
      shell: bash
      working-directory: backend
      run: pip install -r requirements.txt
