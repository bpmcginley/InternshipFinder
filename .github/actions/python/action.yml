name: Python setup
description: Python 3.12 with optional existing backend requirements
inputs:
  cache:
    description: Optional setup-python dependency cache
    default: ''
  install-backend:
    description: Install backend/requirements.txt after setup
    default: 'false'
  install-project:
    description: Install the repository packages in editable mode without changing dependencies
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: ${{ inputs.cache }}
    - name: Install backend dependencies
      if: inputs.install-backend == 'true'
      shell: bash
      working-directory: backend
      run: pip install -r requirements.txt
    - name: Install editable project
      if: inputs.install-project == 'true'
      shell: bash
      run: python -m pip install --no-deps -e .
