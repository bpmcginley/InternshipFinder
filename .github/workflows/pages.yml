name: Deploy site

# Publishes docs/ to GitHub Pages together with the crawlable landing pages under /internships/,
# which backend/internscout/seo_pages.py builds from docs/data on every deploy. They are built here
# rather than committed: 1,000+ pages rewritten four times a day would bloat the repo, and a page
# built at deploy time is always exactly as fresh as the data it is deployed with.
#
# Requires Settings -> Pages -> Source: "GitHub Actions", set before this workflow first runs. While
# the source is "Deploy from a branch", GitHub's own build also publishes docs/ after every push and
# the two deploys overwrite each other, so /internships/ and sitemap.xml come and go. The first step
# refuses to deploy until the source is switched.
on:
  push:
    branches: [main]
  # The ingest job pushes its data commit with GITHUB_TOKEN, and a push made that way starts no
  # other workflow. Following the ingest run is how fresh data gets deployed.
  workflow_run:
    workflows: ["Ingest internships"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Queued, not cancelled (was: true): a newer deploy does include everything an older one would, but
  # cancelling a run that is inside deploy-pages can leave the Pages deployment half-made, and
  # GitHub's own Pages starter workflow sets false for that reason. A queued run waits a few minutes.
  cancel-in-progress: false

# Pinned to ubuntu-24.04 (was: ubuntu-latest): that label moves to Ubuntu 26 on 2026-10-19, and the move should be a deliberate change.
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      pages: ${{ steps.pages.outcome }}     # success or failure: whether the landing pages were built
    steps:
      - name: Check that Pages deploys from this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          src=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type)
          if [ "$src" != "workflow" ]; then
            echo "::error::Pages source is '$src'. Set Settings -> Pages -> Source to GitHub Actions first."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: main             # after an ingest run: the commit that run just pushed

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Save the sitemap that is live now
        # seo_pages keeps a page that is already live until its listings fall well below the bar for
        # a new one (keep_at), so pages near the line do not vanish and return between deploys. On
        # the first deploy there is none, and every page is judged as new.
        run: curl -sfL --max-time 20 https://internscout.org/sitemap.xml -o live-sitemap.xml || rm -f live-sitemap.xml

      - name: Build the site and its landing pages
        id: pages
        # seo_pages uses only the standard library, so nothing is installed.
        # This workflow is the site's only deploy path, so a build that fails here must not also stop
        # the dashboard from deploying: the next step deploys docs/ as it is, and the
        # pages-build-failed job at the end leaves the run red so the failure is still seen. (The
        # build itself skips and counts a malformed listing rather than failing on it.)
        continue-on-error: true
        env:
          # A backstop: seo_pages breaks every tie itself so two builds of the same data are the same
          # bytes, and a fixed hash seed keeps any tie it missed from moving between deploys.
          PYTHONHASHSEED: "0"
        run: |
          cp -r docs _site
          rm -f _site/CNAME        # the custom domain lives in the Pages settings for an Actions deploy
          (cd backend && python -m internscout.seo_pages ../_site ../live-sitemap.xml)
          # For the notify job: what was live before this deploy, and what this deploy publishes.
          mkdir -p sitemaps
          cp _site/sitemap.xml sitemaps/new.xml
          if [ -f live-sitemap.xml ]; then cp live-sitemap.xml sitemaps/old.xml; fi

      - name: Fall back to the dashboard alone
        # Whatever the failed build left in _site is thrown away, so nothing half-written is published.
        # There is no sitemap.xml or robots.txt in docs/, so none is deployed; the next good deploy
        # judges every page as new (see "Save the sitemap"), which costs only the keep_at grace.
        if: steps.pages.outcome == 'failure'
        run: |
          rm -rf _site sitemaps
          cp -r docs _site
          rm -f _site/CNAME
          echo "::error::The landing pages did not build; deploying docs/ without them. See the step above."

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - uses: actions/upload-artifact@v7
        if: steps.pages.outcome == 'success'   # no pages, no sitemap: notify is skipped
        with:
          name: sitemaps
          path: sitemaps
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Bing, and the engines that share its index (DuckDuckGo, Yahoo, ChatGPT search), recrawl the pages
  # this deploy added, removed or changed within hours (growth/indexnow.py). Google reads the sitemap.
  # Not after a fallback deploy: its "new" sitemap would be none at all, and IndexNow would be told
  # every landing page was removed.
  notify:
    needs: [build, deploy]      # was: needs: deploy
    if: needs.build.outputs.pages == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: growth
      - uses: actions/download-artifact@v8
        with:
          name: sitemaps
          path: sitemaps
      - name: Tell IndexNow what changed
        run: python3 growth/indexnow.py sitemaps/old.xml sitemaps/new.xml --submit

  # The fallback above deploys and then would let the run finish green. This job is what keeps a
  # failed landing-page build from going unnoticed: the site is up, and the run still says it broke.
  pages-build-failed:
    needs: [build, deploy]
    if: ${{ !cancelled() && needs.build.outputs.pages == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: |
          echo "::error::The landing pages under /internships/ failed to build, so this deploy published the dashboard without them. See the build job's 'Build the site and its landing pages' step."
          exit 1
