name: Deploy site

# Publishes docs/ to GitHub Pages together with the crawlable landing pages under /internships/,
# which backend/internscout/seo_pages.py builds from docs/data on every deploy. They are built here
# rather than committed: 1,000+ pages rewritten four times a day would bloat the repo, and a page
# built at deploy time is always exactly as fresh as the data it is deployed with.
#
# Requires Settings -> Pages -> Source: "GitHub Actions", set before this workflow first runs. While
# the source is "Deploy from a branch", GitHub's own build also publishes docs/ after every push and
# the two deploys overwrite each other, so /internships/ and sitemap.xml come and go. The first step
# refuses to deploy until the source is switched.
on:
  push:
    branches: [main]
  # The ingest job pushes its data commit with GITHUB_TOKEN, and a push made that way starts no
  # other workflow. Following the ingest run is how fresh data gets deployed.
  workflow_run:
    workflows: ["Ingest internships"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Queued, not cancelled (was: true): a newer deploy does include everything an older one would, but
  # cancelling a run that is inside deploy-pages can leave the Pages deployment half-made, and
  # GitHub's own Pages starter workflow sets false for that reason. A queued run waits a few minutes.
  cancel-in-progress: false

# Pinned to ubuntu-24.04 (was: ubuntu-latest): that label moves to Ubuntu 26 on 2026-10-19, and the move should be a deliberate change.
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check that Pages deploys from this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          src=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type)
          if [ "$src" != "workflow" ]; then
            echo "::error::Pages source is '$src'. Set Settings -> Pages -> Source to GitHub Actions first."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: main             # after an ingest run: the commit that run just pushed

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Save the sitemap that is live now
        # seo_pages keeps a page that is already live until its listings fall well below the bar for
        # a new one (keep_at), so pages near the line do not vanish and return between deploys. On
        # the first deploy there is none, and every page is judged as new.
        # The noindex pages live now (seo_pages HELD_FILE, 2026-10-13) are not in the sitemap, and count as
        # live for keep_at too. Missing before the first deploy that writes it, which is fine.
        # was: only the sitemap was saved.
        run: |
          curl -sfL --max-time 20 https://internscout.org/sitemap.xml -o live-sitemap.xml || rm -f live-sitemap.xml
          curl -sfL --max-time 20 https://internscout.org/noindex-pages.txt -o live-noindex.txt || rm -f live-noindex.txt

      - name: Fetch the paid listings that are on
        # Paid listings (backend/internscout/placements.py, 2026-10-14). Off unless the repo variable
        # INTERNSCOUT_PLACEMENTS_URL is set (a variable, not a secret: the Worker's GET /placements is
        # public and holds only public facts). Unset, or if the Worker does not answer, the build gets an
        # empty list and adds no box. The build checks every placement against the listings the normal
        # pipeline exported and prints a ::warning:: for each one it drops.
        env:
          PLACEMENTS_URL: ${{ vars.INTERNSCOUT_PLACEMENTS_URL }}
        run: |
          if [ -n "$PLACEMENTS_URL" ]; then
            curl -sfL --max-time 20 "$PLACEMENTS_URL" -o placements.json || echo '{"placements":[]}' > placements.json
          else
            echo '{"placements":[]}' > placements.json
          fi

      - name: Build the site and its landing pages
        id: pages
        # seo_pages uses only the standard library, so nothing is installed.
        # A malformed listing is skipped and counted inside the build, so bad data no longer stops a
        # deploy. Anything else that breaks here fails the run and deploys nothing, which leaves the
        # last good site live, landing pages and all.
        # was: continue-on-error: true, then a fallback step that deployed docs/ without the landing
        # pages. That kept the dashboard's data current, but a Pages deploy replaces the whole site, so
        # every page under /internships/ (about 880, all in the submitted sitemap) would have answered
        # 404 until the next good build. A few hours of older listings costs far less than that.
        env:
          # A backstop: seo_pages breaks every tie itself so two builds of the same data are the same
          # bytes, and a fixed hash seed keeps any tie it missed from moving between deploys.
          PYTHONHASHSEED: "0"
        run: |
          cp -r docs _site
          rm -f _site/CNAME        # the custom domain lives in the Pages settings for an Actions deploy
          # --placements-report (2026-10-14): what this build kept and dropped, for the next step. Written
          # outside _site, so it is never published.
          (cd backend && python -m internscout.seo_pages ../_site ../live-sitemap.xml ../live-noindex.txt --placements ../placements.json --placements-report ../placements-report.json)
          # was: (cd backend && python -m internscout.seo_pages ../_site ../live-sitemap.xml ../live-noindex.txt --placements ../placements.json)
          # was: (cd backend && python -m internscout.seo_pages ../_site ../live-sitemap.xml ../live-noindex.txt)
          # was: (cd backend && python -m internscout.seo_pages ../_site ../live-sitemap.xml)
          # For the notify job: what was live before this deploy, and what this deploy publishes.
          mkdir -p sitemaps
          cp _site/sitemap.xml sitemaps/new.xml
          if [ -f live-sitemap.xml ]; then cp live-sitemap.xml sitemaps/old.xml; fi

      - name: Record which paid listings this build kept or dropped
        # Added 2026-10-14 (backend/internscout/placements.py record_runs). Adds today's kept and dropped
        # placements to the Worker's placement_runs table over Cloudflare's D1 HTTP API, so refunds for
        # days a paid box was not on the site can be worked out. Only when paid listings are on (the repo
        # variable is set). It must never fail or hold up the deploy: the script turns any problem,
        # a missing token included, into one ::warning:: that names no secret and no address, and this
        # step may fail without failing the job.
        if: ${{ vars.INTERNSCOUT_PLACEMENTS_URL != '' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          # The same token growth/metrics.py uses; it needs D1: Edit.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: (cd backend && python -m internscout.placements record ../placements-report.json)

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - uses: actions/upload-artifact@v7
        with:
          name: sitemaps
          path: sitemaps
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Bing, and the engines that share its index (DuckDuckGo, Yahoo, ChatGPT search), recrawl the pages
  # this deploy added, removed or changed within hours (growth/indexnow.py). Google reads the sitemap.
  notify:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: growth
      - uses: actions/download-artifact@v8
        with:
          name: sitemaps
          path: sitemaps
      - name: Tell IndexNow what changed
        run: python3 growth/indexnow.py sitemaps/old.xml sitemaps/new.xml --submit
