name: Release extension

# Push a tag like ext-v0.3.0 to build the extension zip and attach it to a GitHub Release.
# The tag version must match "version" in extension/manifest.json.
#   git tag ext-v0.3.0 && git push origin ext-v0.3.0
on:
  push:
    tags: ["ext-v*"]

permissions:
  contents: write               # create the release and upload the zip

concurrency:
  group: extension-release-${{ github.ref }}
  cancel-in-progress: false

# Pinned to ubuntu-24.04 (was: ubuntu-latest): that label moves to Ubuntu 26 on 2026-10-19, and the move should be a deliberate change.
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches manifest version
        run: |
          manifest=$(python3 -c "import json;print(json.load(open('extension/manifest.json'))['version'])")
          tag="${GITHUB_REF_NAME#ext-v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $manifest"
            exit 1
          fi

      - name: Run extension tests
        run: node --test extension/test/*.test.mjs

      - name: Check package reproducibility
        run: python3 -m unittest discover -s scripts -p 'test_release_extension.py'

      - name: Build packages and source record
        id: build
        run: |
          python3 scripts/release_extension.py > "$RUNNER_TEMP/extension-build.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ["RUNNER_TEMP"] + "/extension-build.json") as f:
              paths = json.load(f)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              for key, path in paths.items():
                  f.write(f"{key}={path}\n")
          PY

      - name: Publish verified assets without overwriting
        env:
          GH_TOKEN: ${{ github.token }}
          DEVELOPER: ${{ steps.build.outputs.developer }}
          WEBSTORE: ${{ steps.build.outputs.webstore }}
          RECORD: ${{ steps.build.outputs.record }}
        run: bash scripts/publish_extension_release.sh
