# was: name: Email digest preview
# It can send now, once the owner turns sending on, so "preview" no longer describes it.
name: Email digest

# growth/digest.py writes this week's new-internships email from docs/data: the fields that gained
# the most new roles, Northeast and remote first. Every run uploads the HTML, text and JSON as an
# artifact to read.
#
# Sending stays off until the repository variable DIGEST_ENABLED is 1. Then growth/digest_send.py
# sends the email through Buttondown with the secrets BUTTONDOWN_API_KEY and DIGEST_POSTAL_ADDRESS,
# and refuses, naming what is missing, if either is empty. A run started by hand sends only a test
# copy to the address in the DIGEST_TEST_TO variable, unless "Send to every subscriber" is ticked.
# growth/README.md lists the setup steps in order.
on:
  workflow_dispatch:
    inputs:
      everyone:
        description: "Send to every subscriber. Unticked, only a test copy goes to DIGEST_TEST_TO. Nothing is sent unless DIGEST_ENABLED is 1."
        type: boolean
        default: false
      check_key:
        description: "Only check that the BUTTONDOWN_API_KEY secret works: one read from Buttondown, nothing sent."
        type: boolean
        default: false
  # Weekly opt-in digest. The postal mailbox was approved on 2026-10-15.
  # A scheduled run sends to confirmed subscribers when DIGEST_ENABLED is 1, and only
  # writes the preview when it isn't. Manual runs still default to an owner-only test.
  schedule:
    - cron: "0 12 * * 1"    # Mondays 12:00 UTC: 8am Eastern in daylight time (EDT), 7am in winter (EST)
  # was: # Mondays, 8am US Eastern. GitHub's cron is UTC and doesn't follow daylight saving time.

permissions:
  contents: read

concurrency:
  group: email-digest
  cancel-in-progress: false

jobs:
  preview:
    # Pinned like the other workflows (was: ubuntu-latest): that label moves to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            growth
            backend
            docs/data

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Write the digest
        # digest.py and seo_pages use only the standard library, so nothing is installed.
        run: python growth/digest.py docs --out digest-preview

      - uses: actions/upload-artifact@v7
        with:
          name: digest-preview
          path: digest-preview
          retention-days: 14

      - name: Check the Buttondown key
        # Run by hand with "check_key" ticked (2026-10-13): one read, the same-week check, with the key.
        # It runs whether or not DIGEST_ENABLED is 1, sends nothing and never prints the key.
        if: github.event_name == 'workflow_dispatch' && inputs.check_key
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python growth/digest_send.py --check

      - name: Send the digest
        # digest_send.py uses only the standard library too. The input and variables reach the script
        # through env, never pasted into the command, so no value can change what the shell runs.
        # A send to everyone refuses (exit 2) when Buttondown already has an email sent or scheduled in
        # the last six days, so a rerun can't send subscribers a second copy; the override,
        # --allow-same-week, is left for a person to run by hand after checking the dashboard.
        # --public-archive (2026-10-06) puts each week's email on the newsletter's public web archive at
        # Buttondown, which every sign-up form links as "See last Monday's email". Only the send to
        # everyone has it: a test copy's draft stays off the archive. The email is the same for every
        # subscriber and carries nothing about any of them.
        # was: if: vars.DIGEST_ENABLED == '1'. A key check sends nothing, even with sending on.
        if: vars.DIGEST_ENABLED == '1' && !inputs.check_key
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          DIGEST_POSTAL_ADDRESS: ${{ secrets.DIGEST_POSTAL_ADDRESS }}
          DIGEST_TEST_TO: ${{ vars.DIGEST_TEST_TO }}
          EVERYONE: ${{ github.event_name == 'schedule' || inputs.everyone }}
        run: |
          if [ "$EVERYONE" = "true" ]; then
            python growth/digest_send.py docs --send --public-archive
          else
            python growth/digest_send.py docs --send --test-to "$DIGEST_TEST_TO"
          fi
