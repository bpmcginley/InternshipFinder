name: Ingest internships

# Runs the scraper on a schedule and commits fresh data for the Pages site.
on:
  schedule:
    - cron: "0 */6 * * *"     # every 6 hours (UTC)
  workflow_dispatch:            # manual "Run workflow" button
  push:
    branches: [main]
    # tests and one-off scripts never change what an ingest produces, so a push of only those
    # no longer starts a full run (2026-09 audit; was: every file under backend/ except data/)
    paths: ["backend/**", "!backend/data/**", "!backend/tests/**", "!backend/scripts/**", ".github/workflows/ingest.yml"]

permissions:
  contents: write               # allow committing the data back

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        working-directory: backend
        run: pip install -r requirements.txt

      # Extra states (beyond New England + NY/NJ) that get detail calls and Google searches:
      # the states students picked (Worker GET /demand, counts only) plus the optional repo variable.
      - name: Add states students picked
        env:
          DEMAND_URL: ${{ secrets.INTERNSCOUT_DEMAND_URL }}
          DEMAND_TOKEN: ${{ secrets.INTERNSCOUT_DEMAND_TOKEN }}
          EXTRA: ${{ vars.INTERNSCOUT_WANTED_STATES }}
        run: |
          picked=""
          if [ -n "$DEMAND_URL" ] && [ -n "$DEMAND_TOKEN" ]; then
            picked=$(curl -fsS --max-time 20 -H "Authorization: Bearer $DEMAND_TOKEN" "$DEMAND_URL" \
              | jq -r '.states | keys | map(select(length == 2)) | join(",")') || picked=""
          else
            echo "No Worker /demand secrets set; using the repo variable only."
          fi
          states=$(printf '%s,%s' "$EXTRA" "$picked" | sed 's/^,*//; s/,*$//')
          echo "Wanted states beyond the baseline: ${states:-none}"
          echo "INTERNSCOUT_WANTED_STATES=$states" >> "$GITHUB_ENV"

      - name: Run ingester and export static JSON
        working-directory: backend
        env:
          INTERNSCOUT_DB: ${{ github.workspace }}/internscout.db
          # Look up unknown NY/NJ/PA towns once (cached in backend/data/geocache.json)
          INTERNSCOUT_GEOCODE: "1"
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}   # optional: enables Google Jobs search layer
          # optional: federal student jobs (free key from developer.usajobs.gov; the email it was issued to)
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: |
          python -m internscout.run_ingest --export "${{ github.workspace }}/docs/data"

      - name: Coverage report
        working-directory: backend
        # The report names the keyed sources that are switched off, so it has to be handed the same
        # keys the ingest step was. Without them it read every one as unset and told us to go and get
        # two keys the run above had just used to fetch 119 federal postings.
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: python -m internscout.coverage "${{ github.workspace }}/docs/data/listings"

      - name: Commit updated data
        run: |
          git config user.name  "internscout-bot"
          git config user.email "actions@github.com"
          # probe_cache.json earns its name only if it survives the run that filled it.
          git add -A docs/data backend/data/ats_registry.json backend/data/geocache.json backend/data/probe_cache.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "data: refresh listings ($(date -u +%FT%TZ))"
            # A run that waited in the queue checked out an older commit; replay onto main and keep this run's data.
            for i in 1 2 3; do
              git push && break
              [ "$i" = 3 ] && exit 1
              # --autostash: the run leaves other tracked files dirty, and rebase refuses to
              # start on a dirty tree, which turned every raced push into a lost data commit.
              git pull --rebase --autostash -X theirs origin main
            done
          fi
