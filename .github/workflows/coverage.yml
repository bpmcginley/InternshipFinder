name: Coverage reports

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

# Report-only means no coverage threshold. Test failures still fail the job.
# Upload only named source-free reports, never HTML or raw V8/coverage databases.
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test and coverage dependencies
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt -r requirements-coverage.txt pytest pillow cryptography
          sudo apt-get install -y -qq ffmpeg >/dev/null || echo "::warning::no ffmpeg: the Reel render test is skipped"
      - name: Measure backend and growth coverage
        working-directory: backend
        env:
          COVERAGE_FILE: ../coverage/python/.coverage
        # No traceback/source values in coverage-job diagnostics. Normal test CI
        # remains separate; XML contains filenames, line numbers and hit counts.
        run: python -m pytest tests/ -q --tb=no --show-capture=no --cov=internscout --cov=../growth --cov-report=term --cov-report=xml:../coverage/python/coverage.xml
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage-python
          path: coverage/python/coverage.xml
          if-no-files-found: warn
          retention-days: 14

  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install pinned Node coverage dependencies
        working-directory: worker
        run: npm ci
      - name: Verify coverage filename attribution
        run: node --test --test-reporter=dot scripts/test_coverage_vm.mjs
      - name: Measure worker, extension, and site coverage
        working-directory: worker
        run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage-node
          path: |
            coverage/node/lcov.info
            coverage/node/coverage-summary.json
          if-no-files-found: warn
          retention-days: 14
