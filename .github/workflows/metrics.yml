name: Dashboard metrics

# Every hour, growth/metrics.py copies the numbers the private analytics dashboard shows (visits by
# day and source, top pages, the brand accounts on Bluesky, Instagram and Mastodon, the last run of
# each job below, listings) into the app's D1 database. Totals only.
on:
  schedule:
    # the current hour, so hourly keeps the dashboard current; minute 23 stays clear of the top of the
    # hour, when GitHub's scheduler is busiest and delays runs. Free for a public repository.
    - cron: "23 * * * *"
  workflow_dispatch:

# actions: read lets GITHUB_TOKEN see the other workflows' last runs (the dashboard's job health).
permissions:
  contents: read
  actions: read

concurrency:
  group: dashboard-metrics
  cancel-in-progress: false

# Pinned to ubuntu-24.04 (was: ubuntu-latest): that label moves to Ubuntu 26 on 2026-10-19, and the move should be a deliberate change.
jobs:
  metrics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # digest and the brand posts do (digest.new_roles), which needs the listings and
          # backend/internscout (standard library only, so no pip install); with just stats.json it fell
          # back to the pre-dedupe count, so the dashboard disagreed with the email and the posts.
          sparse-checkout: |
            .github/actions
            growth
            backend/internscout
            docs/data
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/python

      - name: Search Console sign-in library
        # cryptography signs the service account's sign-in token (growth/metrics.py _jwt).
        run: python -m pip install -q cryptography

      - name: Write the day's numbers
        env:
          # Needs Account Analytics: Read and D1: Edit.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          MASTODON_URL: ${{ secrets.MASTODON_URL }}
          # Only to find the working token Brand posts keeps in D1; this job never refreshes it.
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          # A Google service account's JSON key, a Restricted user on the Search Console property.
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          # An API key from Bing Webmaster Tools (Settings, API access). Without it the snapshot has no
          # Bing numbers and lists "bing: no BING_WEBMASTER_KEY" under problems.
          BING_WEBMASTER_KEY: ${{ secrets.BING_WEBMASTER_KEY }}
        run: python growth/metrics.py docs --write
