name: Dashboard metrics

# Every hour, growth/metrics.py copies the numbers the private analytics dashboard shows (visits by
# day and source, top pages, Bluesky, listings) into the app's D1 database. Totals only.
on:
  schedule:
    # was: "30 11 * * *" (once a day, 7:30am US Eastern). Each run rewrites the last 30 days through
    # the current hour, so hourly keeps the dashboard current; minute 23 stays clear of the top of the
    # hour, when GitHub's scheduler is busiest and delays runs. Free for a public repository.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-metrics
  cancel-in-progress: false

# Pinned to ubuntu-24.04 (was: ubuntu-latest): that label moves to Ubuntu 26 on 2026-10-19, and the move should be a deliberate change.
jobs:
  metrics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # was: growth + docs/data/stats.json only. growth/metrics.py counts "new this week" the way the
          # digest and the brand posts do (digest.new_roles), which needs the listings and
          # backend/internscout (standard library only, so no pip install); with just stats.json it fell
          # back to the pre-dedupe count, so the dashboard disagreed with the email and the posts.
          sparse-checkout: |
            growth
            backend/internscout
            docs/data
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Write the day's numbers
        env:
          # Needs Account Analytics: Read and D1: Edit.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
        run: python growth/metrics.py docs --write
