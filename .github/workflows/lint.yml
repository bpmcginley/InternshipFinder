name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python
      - uses: ./.github/actions/node
      - name: Install pinned lint tools
        run: |
          python -m pip install -r requirements-lint.txt
          npm ci --ignore-scripts
      - name: Verify source-free diagnostics
        run: node --test scripts/lint_report.test.mjs
      - name: Check Python correctness rules
        run: npm run lint:python
      - name: Check JavaScript correctness rules
        run: npm run lint:javascript
      # Format checks begin only after the separate approved mechanical formatting PRs.
