# InternScout API: the product's only server. Setup steps are in README.md.
name = "internscout-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Workers Logs stay off: we promise not to keep request data.
[observability]
enabled = false

# Daily cleanup of old rate buckets and runs
[triggers]
crons = ["17 7 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "internscout"
database_id = "ef477808-f94c-4dce-a0b3-1198f00e5c39"

# Secrets (set with `wrangler secret put`, never here): GEMINI_API_KEY, HASH_SALT, DEMAND_TOKEN,
# and for the optional paid plans: STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, STRIPE_PRICE_ID
# (Supporter) and STRIPE_PRICE_ID_PRO (Pro). A plan whose price id is unset is simply not offered.
#
# This block is the COMPLETE set of plain vars after every deploy. `wrangler deploy` defaults to
# --keep-vars=false, so anything typed into the Cloudflare dashboard Variables panel and not repeated
# here is deleted on the next deploy, without warning and without appearing in the diff. Write down
# what that panel holds before deploying. Secrets are not affected: they live in a separate store and
# survive a deploy either way.
#
# One var the code reads is deliberately absent: DAILY_BUDGET_CENTS (src/limits.js
# dailyBudgetCents). Left unset it is a thirtieth of MONTHLY_BUDGET_CENTS, so raising the month
# raises the day with it and the two cannot drift. Pinning it here would break that link. Set it only
# to override the day's share by hand, and then remember it is the free tier's share alone.
[vars]
# Anyone with a Google or Microsoft account can sign in; a provider is off while its client ID is empty.
GOOGLE_CLIENT_ID = "393696929617-g2ck4v93fdl54gioop0utk9c46p4thut.apps.googleusercontent.com"
MS_CLIENT_ID = "06542657-1679-4c40-ae61-96dc9a0f1ca2"
# Verified .edu emails (plus these non-.edu school domains, comma list) get the full allowance
EDU_EXTRA_DOMAINS = ""
# Everyone else gets this percent of it (minimum 1 per task)
GENERAL_ALLOWANCE_PCT = "50"
# Two extension origins. jmjj... is the ID the manifest "key" fixes for every Load unpacked copy;
# hpnbb... is the ID the Chrome Web Store assigned when the item was created (the store zip has no
# "key", so the store did not reuse jmjj...). Both have to be here or that copy's AI calls fail CORS.
ALLOWED_ORIGINS = "https://bpmcginley.github.io,http://localhost:8000,chrome-extension://jmjjgnckddhjbohfpbekodkpbpbmfjag,chrome-extension://hpnbbpmalfjijnmpoihhjgjolhabjpgi"
MONTHLY_BUDGET_CENTS = "7500"
# AI calls per minute across everyone, so a busy hour cannot spend the whole Gemini per-minute quota
# and leave every student with upstream 429s. Your account's real number is at
# aistudio.google.com/rate-limit -- set this under it, with headroom. "0" turns AI off immediately.
GLOBAL_RPM = "120"
# The paid plans are dormant until this is "1" and the Stripe secrets are set. While it is off,
# nothing about paying is shown and the billing routes answer 404.
PAYMENTS_ENABLED = "1"
# Stripe Managed Payments: Stripe is the merchant of record, so it charges and remits sales tax or
# VAT for the student's country and handles disputes. Needs Managed Payments activated at
# dashboard.stripe.com/settings/managed-payments and an eligible tax code on both products, or
# Stripe refuses the checkout session. "0" sends plain checkout sessions.
STRIPE_MANAGED_PAYMENTS = "1"
# Shown on the upgrade buttons. Stripe charges whatever the price in your Stripe dashboard says,
# so keep these in step with it.
SUPPORTER_PRICE_TEXT = "$5/month"
PRO_PRICE_TEXT = "$12/month"
# Where Stripe sends students back to after checkout
SITE_URL = "https://bpmcginley.github.io/InternshipFinder"
