# InternScout API: the product's only server. Setup steps are in README.md.
name = "internscout-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Workers Logs stay off: we promise not to keep request data.
[observability]
enabled = false

# Daily cleanup of old rate buckets and runs
[triggers]
crons = ["17 7 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "internscout"
database_id = "REPLACE_WITH_ID_FROM_WRANGLER_D1_CREATE"

# Secrets (set with `wrangler secret put`, never here): GEMINI_API_KEY, HASH_SALT, DEMAND_TOKEN
[vars]
# Anyone with a Google or Microsoft account can sign in; a provider is off while its client ID is empty.
GOOGLE_CLIENT_ID = "393696929617-g2ck4v93fdl54gioop0utk9c46p4thut.apps.googleusercontent.com"
MS_CLIENT_ID = "06542657-1679-4c40-ae61-96dc9a0f1ca2"
# Verified .edu emails (plus these non-.edu school domains, comma list) get the full allowance
EDU_EXTRA_DOMAINS = ""
# Everyone else gets this percent of it (minimum 1 per task)
GENERAL_ALLOWANCE_PCT = "50"
ALLOWED_ORIGINS = "https://bpmcginley.github.io,http://localhost:8000"
MONTHLY_BUDGET_CENTS = "2500"
# AI calls per minute across everyone, so a busy hour cannot spend the whole Gemini per-minute quota
# and leave every student with upstream 429s. Your account's real number is at
# aistudio.google.com/rate-limit -- set this under it, with headroom. "0" turns AI off immediately.
GLOBAL_RPM = "120"
